spring:
  application:
    name: smartjewel-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartjewel}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
    jwt:
      secret: ${JWT_SECRET:4zV9mK8xL2pQ5wR8tY1uI4oP7sA0dF3gH6jK9lM2nB5vC8xZ1qW4eR7tY0uI3oP}
      expiration-ms: 86400000 # 24 horas em milissegundos

server:
  port: 8080
