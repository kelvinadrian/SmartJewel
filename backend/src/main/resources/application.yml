spring:
  application:
    name: smartjewel-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartjewel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
    jwt:
      secret: ${JWT_SECRET:4zV9mK8xL2pQ5wR8tY1uI4oP7sA0dF3gH6jK9lM2nB5vC8xZ1qW4eR7tY0uI3oP}
      expiration-ms: 86400000 # 24 horas em milissegundos

supabase:
  url: ${SUPABASE_URL:https://your-supabase-project.supabase.co}
  key: ${SUPABASE_KEY:your-supabase-anon-key}
  bucket: ${SUPABASE_STORAGE_BUCKET:product-images}

server:
  port: 8080
