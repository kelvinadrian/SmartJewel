spring:
  application:
    name: smartjewel-backend

  datasource:
    url: ${DB_URL}?prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      initialization-fail-timeout: 1

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: ${SUPABASE_STORAGE_BUCKET:product-images}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework: INFO
    com.zaxxer.hikari: DEBUG
    org.hibernate: INFO
    org.postgresql: TRACE

