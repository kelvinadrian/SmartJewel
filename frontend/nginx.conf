server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy Reverso para a API Spring Boot Backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicação de Catálogo Público (catalog-app) na raiz
    location / {
        root /usr/share/nginx/html/catalog-app/browser;
        try_files $uri $uri/ /index.html;
    }

    # Aplicação Administrativa (admin-app) na rota /admin
    location /admin {
        alias /usr/share/nginx/html/admin-app/browser;
        try_files $uri $uri/ /admin/index.html;
    }
}
