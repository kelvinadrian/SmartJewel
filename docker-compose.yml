version: '3.8'

services:
  # -------------------------------------------------------------
  # Backend Spring Boot Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartjewel-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres}
      - DB_USER=${DB_USER:-postgres.your-project-id}
      - DB_PASSWORD=${DB_PASSWORD:-your-password}
      - JWT_SECRET=${JWT_SECRET:-4zV9mK8xL2pQ5wR8tY1uI4oP7sA0dF3gH6jK9lM2nB5vC8xZ1qW4eR7tY0uI3oP}
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-product-images}
    env_file:
      - .env
    restart: unless-stopped

  # -------------------------------------------------------------
  # Frontend Angular Service (Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartjewel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
