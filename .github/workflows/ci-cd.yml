name: SmartJewel Monorepo CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Continuous Integration (CI) - Backend (Spring Boot)
  # -------------------------------------------------------------
  ci-backend:
    name: CI - Backend (Java 21 & Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar e Executar Testes Unitários do Backend
        run: |
          cd backend
          mvn clean test

  # -------------------------------------------------------------
  # JOB 2: Continuous Integration (CI) - Frontend (Angular Workspace)
  # -------------------------------------------------------------
  ci-frontend:
    name: CI - Frontend (Angular Workspace: Admin & Catalog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências e Compilar Projetos do Workspace
        run: |
          cd frontend
          npm ci || npm install
          npm run build:core
          npm run build:admin
          npm run build:catalog

  # -------------------------------------------------------------
  # JOB 3: Continuous Deployment (CD) - Multi-Image Build & Push
  # -------------------------------------------------------------
  cd:
    name: Continuous Deployment (Docker Build & Push)
    needs: [ ci-backend, ci-frontend ]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código do Repositório
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 1. Build & Push BACKEND Docker Image
      # ---------------------------------------------------------
      - name: Extrair Metadata para Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartjewel-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push Imagem Docker Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ---------------------------------------------------------
      # 2. Build & Push FRONTEND ADMIN Docker Image
      # ---------------------------------------------------------
      - name: Extrair Metadata para Admin App
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartjewel-admin
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push Imagem Docker Admin App
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.admin
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}

      # ---------------------------------------------------------
      # 3. Build & Push FRONTEND CATALOG Docker Image
      # ---------------------------------------------------------
      - name: Extrair Metadata para Catalog App
        id: meta-catalog
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartjewel-catalog
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push Imagem Docker Catalog App
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.catalog
          push: true
          tags: ${{ steps.meta-catalog.outputs.tags }}
          labels: ${{ steps.meta-catalog.outputs.labels }}

      # ---------------------------------------------------------
      # 4. Atualizar Tags nos Manifestos Kubernetes
      # ---------------------------------------------------------
      - name: Atualizar Tags de Imagem nos Manifestos Kubernetes
        run: |
          BACKEND_TAG="ghcr.io/${{ github.repository_owner }}/smartjewel-backend:${GITHUB_SHA::7}"
          ADMIN_TAG="ghcr.io/${{ github.repository_owner }}/smartjewel-admin:${GITHUB_SHA::7}"
          CATALOG_TAG="ghcr.io/${{ github.repository_owner }}/smartjewel-catalog:${GITHUB_SHA::7}"

          echo "Atualizando k8s/deployment.yaml..."
          sed -i "s|image: smartjewel/backend:latest|image: $BACKEND_TAG|g" k8s/deployment.yaml

          echo "Atualizando k8s/admin-deployment.yaml..."
          sed -i "s|image: smartjewel/admin:latest|image: $ADMIN_TAG|g" k8s/admin-deployment.yaml

          echo "Atualizando k8s/catalog-deployment.yaml..."
          sed -i "s|image: smartjewel/catalog:latest|image: $CATALOG_TAG|g" k8s/catalog-deployment.yaml

          cat k8s/deployment.yaml | grep "image:"
          cat k8s/admin-deployment.yaml | grep "image:"
          cat k8s/catalog-deployment.yaml | grep "image:"
