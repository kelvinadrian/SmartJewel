name: SmartJewel Monorepo CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Continuous Integration (CI) - Backend (Spring Boot)
  # -------------------------------------------------------------
  ci-backend:
    name: CI - Backend (Java 21 & Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar e Executar Testes Unitários do Backend
        run: |
          cd backend
          mvn clean test

  # -------------------------------------------------------------
  # JOB 2: Continuous Integration (CI) - Frontend (Angular)
  # -------------------------------------------------------------
  ci-frontend:
    name: CI - Frontend (Angular & Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências e Compilar Angular Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # -------------------------------------------------------------
  # JOB 3: Continuous Deployment (CD) - Docker & Kubernetes Update
  # -------------------------------------------------------------
  cd:
    name: Continuous Deployment (Docker Build & Push)
    needs: [ ci-backend, ci-frontend ]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código do Repositório
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Build & Push BACKEND Docker Image
      # ---------------------------------------------------------
      - name: Extrair Tags e Labels para Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartjewel-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push da Imagem Docker do Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ---------------------------------------------------------
      # Build & Push FRONTEND Docker Image
      # ---------------------------------------------------------
      - name: Extrair Tags e Labels para Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartjewel-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push da Imagem Docker do Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # ---------------------------------------------------------
      # Atualizar Tags nos Manifestos Kubernetes
      # ---------------------------------------------------------
      - name: Atualizar Tags de Imagem nos Manifestos Kubernetes
        run: |
          BACKEND_TAG="ghcr.io/${{ github.repository_owner }}/smartjewel-backend:${GITHUB_SHA::7}"
          FRONTEND_TAG="ghcr.io/${{ github.repository_owner }}/smartjewel-frontend:${GITHUB_SHA::7}"

          echo "Atualizando k8s/deployment.yaml para: $BACKEND_TAG"
          sed -i "s|image: smartjewel/backend:latest|image: $BACKEND_TAG|g" k8s/deployment.yaml

          echo "Atualizando k8s/frontend-deployment.yaml para: $FRONTEND_TAG"
          sed -i "s|image: smartjewel/frontend:latest|image: $FRONTEND_TAG|g" k8s/frontend-deployment.yaml

          cat k8s/deployment.yaml | grep "image:"
          cat k8s/frontend-deployment.yaml | grep "image:"
