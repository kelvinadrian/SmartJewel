apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartjewel-admin-deployment
  labels:
    app: smartjewel-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartjewel-admin
  template:
    metadata:
      labels:
        app: smartjewel-admin
    spec:
      containers:
        - name: admin-app
          image: smartjewel/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
